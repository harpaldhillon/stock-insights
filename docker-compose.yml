# Development stack: source is bind-mounted, the backend uses the database file
# in ./backend and the frontend runs the Vite dev server with hot reload.
# For production use docker-compose.prod.yml.
services:
  backend:
    image: localhost/ftse-analyser-backend:dev
    build:
      context: ./backend
    # The images run as UID 1000, not root. With rootless podman, keep-id maps
    # your host UID to the same UID inside the container, so it can write the
    # bind-mounted files you own (database, caches). Docker doesn't support
    # keep-id: remove these lines there (rootful Docker already maps 1000->1000).
    userns_mode: keep-id
    ports:
      # Localhost only: the API has no authentication, so don't expose it to the LAN.
      - '127.0.0.1:8000:8000'
    volumes:
      - ./backend:/app
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    environment:
      - PYTHONUNBUFFERED=1
      # Keep the database and cache in the bind-mounted source folder in dev.
      - DATABASE_URL=sqlite:///./ftse_analyser.db
      - XDG_CACHE_HOME=/app/.cache
  frontend:
    image: localhost/ftse-analyser-frontend:dev
    build:
      context: ./frontend
      target: dev
    userns_mode: keep-id
    ports:
      - '127.0.0.1:3000:3000'
    volumes:
      - ./frontend:/app
      # Keep the image's node_modules (Linux binaries) instead of the host's.
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
