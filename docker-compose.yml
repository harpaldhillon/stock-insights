version: '3.9'
services:
  backend:
    build:
      context: ./backend
    ports:
      # Localhost only: the API has no authentication, so don't expose it to the LAN.
      - '127.0.0.1:8000:8000'
    volumes:
      - ./backend:/app
    environment:
      - PYTHONUNBUFFERED=1
  frontend:
    build:
      context: ./frontend
    ports:
      - '127.0.0.1:3000:3000'
    volumes:
      - ./frontend:/app
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]
    environment:
      - CHOKIDAR_USEPOLLING=true
